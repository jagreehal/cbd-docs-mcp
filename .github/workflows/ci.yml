name: ci
on:
  push:
    branches: [main]
  pull_request:
  # The tests read the live docs site, so a daily run catches a change to the
  # manifest or .md twins that this server depends on.
  schedule:
    - cron: '43 6 * * *'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
